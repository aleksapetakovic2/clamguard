# Runs the whole suite on every push and pull request, twice: with the oldest
# Python and PySide6 the README promises, and with the newest. ClamAV is not
# installed, so the tests that need a real scanner skip themselves.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}, ${{ matrix.pyside }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pyside: PySide6-Essentials==6.8.*
          - python: "3.14"
            pyside: PySide6-Essentials

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: ${{ matrix.python }}

      # What PySide6's bundled Qt links against, for the offscreen platform the
      # tests run on. Most are on the runner already; this makes sure.
      - name: Install Qt's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 \
            libfreetype6 libdbus-1-3 libglib2.0-0t64

      - name: Install PySide6
        run: python -m pip install "${{ matrix.pyside }}"

      - name: Run the tests
        env:
          CLAMGUARD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -o pipefail
          ./run-tests 2>&1 | tee test-output.txt

      # Each failure becomes an annotation on the run's page. Unlike the log,
      # annotations can be read without signing in to GitHub.
      - name: Annotate failures
        if: failure()
        run: |
          python - <<'SCRIPT'
          import pathlib

          def escape(text, is_property=False):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return text.replace(":", "%3A").replace(",", "%2C") if is_property else text

          output = pathlib.Path("test-output.txt")
          text = output.read_text(errors="replace") if output.exists() else ""
          blocks = text.split("\n" + "=" * 70 + "\n")[1:]
          if blocks:
              blocks[-1] = blocks[-1].split("\n" + "-" * 70 + "\nRan ")[0]
          for block in blocks[:10]:
              title, _, body = block.partition("\n")
              body = body.split("-" * 70 + "\n", 1)[-1].strip()
              print(f"::error title={escape(title[:200], True)}::{escape(body[-3000:])}")
          if not blocks:
              print("::error::The tests did not run to completion; see the log.")
          SCRIPT
